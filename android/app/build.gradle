apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion = rootProject.ext.ndkVersion
    buildToolsVersion = rootProject.ext.buildToolsVersion
    // Latest platform release: Android 37 with minor API level 2 (AGP 9 DSL).
    compileSdk {
        version = release(rootProject.ext.compileSdkVersion) {
            minorApiLevel = 2
        }
    }

    namespace = "com.photoplus"
    defaultConfig {
        applicationId = "com.photoplus"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 1
        versionName = "0.1.0"

        externalNativeBuild {
            cmake {
                // Must match React Native's STL to avoid duplicate runtimes.
                arguments += ["-DANDROID_STL=c++_shared"]
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "4.1.2"
        }
    }

    androidResources {
        // The depth model is memory-mapped straight from the APK.
        noCompress.add("tflite")
    }

    testOptions {
        unitTests.returnDefaultValues = false
        unitTests.all { useJUnitPlatform() }
    }
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig = signingConfigs.debug
            minifyEnabled = enableProguardInReleaseBuilds
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }
}

def cameraxVersion = "1.6.2"

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Camera
    implementation("androidx.camera:camera-camera2:$cameraxVersion")
    implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
    implementation("androidx.camera:camera-view:$cameraxVersion")
    // Image metadata
    implementation("androidx.exifinterface:exifinterface:1.4.2")
    // Latest AndroidX core/appcompat (React Native would otherwise resolve older ones).
    implementation("androidx.core:core-ktx:1.19.1")
    implementation("androidx.appcompat:appcompat:1.8.0")
    // System photo picker (ActivityResultRegistry; no storage permission needed).
    implementation("androidx.activity:activity-ktx:1.13.0")
    // On-device vision (offline): face contours for skin retouching and
    // person segmentation are bundled; subject segmentation (people and
    // objects) is a Google Play services module downloaded on first use.
    implementation("com.google.mlkit:face-detection:16.1.7")
    implementation("com.google.mlkit:segmentation-selfie:16.0.0-beta6")
    implementation("com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1")
    // On-device inference for Spotlight's depth estimate (16 KB page aligned).
    implementation("com.google.ai.edge.litert:litert:2.3.2")

    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    // Real org.json for JVM tests (the Android stub throws).
    testImplementation("org.json:json:20260814")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Spotlight depth model: Depth Anything V2 Small (Apache-2.0), LiteRT build
// with 8-bit weights. Fetched once at a pinned revision, verified against its
// published SHA-256 and cached outside the build directory; it is packaged
// as a generated asset so the 28 MB binary never lives in the repository.
// Offline builds can pass -Pphotoplus.depthModel=false: Spotlight then uses
// the engine's built-in ground-plane depth estimate.
import java.security.MessageDigest

abstract class FetchDepthModel extends DefaultTask {
    @Input abstract Property<String> getUrl()
    @Input abstract Property<String> getSha256()
    @Input abstract Property<String> getAssetName()
    @Internal abstract RegularFileProperty getCacheFile()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    static String digest(File f) {
        def md = MessageDigest.getInstance("SHA-256")
        f.withInputStream { i ->
            byte[] buf = new byte[1 << 16]
            int n
            while ((n = i.read(buf)) > 0) md.update(buf, 0, n)
        }
        return md.digest().encodeHex().toString()
    }

    @TaskAction
    void fetch() {
        def cache = cacheFile.get().asFile
        if (!cache.exists() || digest(cache) != sha256.get()) {
            cache.parentFile.mkdirs()
            def part = new File(cache.path + ".part")
            logger.lifecycle("Downloading the Spotlight depth model…")
            URI.create(url.get()).toURL().withInputStream { i -> part.withOutputStream { o -> o << i } }
            def actual = digest(part)
            if (actual != sha256.get()) {
                part.delete()
                throw new GradleException("Depth model checksum mismatch (got $actual)")
            }
            cache.delete()
            if (!part.renameTo(cache)) throw new GradleException("Could not store the depth model in ${cache.parent}")
        }
        def out = outputDir.get().file(assetName.get()).asFile
        out.parentFile.mkdirs()
        java.nio.file.Files.copy(cache.toPath(), out.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

def depthModelSha = "f74509422e4a9270a354b249a9193abdd4903354be63701262238a7f4b869611"
def fetchDepthModel = tasks.register("fetchDepthModel", FetchDepthModel) {
    url = "https://huggingface.co/litert-community/depth-anything-v2-small/resolve/" +
          "178427e448dbf4da93b1e7b1b2abc103ad329bd6/tflite/depth_anything_v2_small_wi8_afp32.tflite"
    sha256 = depthModelSha
    assetName = "spotlight_depth.tflite" // DepthEstimator.ASSET
    cacheFile = new File(gradle.gradleUserHomeDir, "caches/photoplus/depth-${depthModelSha.take(16)}.tflite")
    outputDir = layout.buildDirectory.dir("generated/depthModel")
}

if (providers.gradleProperty("photoplus.depthModel").getOrElse("true").toBoolean()) {
    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.sources.assets?.addGeneratedSourceDirectory(fetchDepthModel, { it.outputDir })
        }
    }
}
