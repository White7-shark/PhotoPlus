buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 29 // Android 10 — product spec minimum
        compileSdkVersion = 37
        targetSdkVersion = 37
        ndkVersion = "30.0.16248370"
        kotlinVersion = "2.4.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Pinned to the latest stable releases (React Native's catalog defaults
        // to older ones: AGP 9.2.1 / Kotlin 2.2.0).
        classpath("com.android.tools.build:gradle:9.5.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"
